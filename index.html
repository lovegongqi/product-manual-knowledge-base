<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>怡口净水产品知识库</title>
    <meta
      name="description"
      content="怡口净水产品说明书、水批认证资料与产品条码匹配的统一查询入口。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C11 10 7 14 7 19a9 9 0 0 0 18 0c0-5-4-9-9-16z' fill='%230ea5b7'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f2f7f9;
        --ink: #0f172a;
        --muted: #5b6b7f;
        --line: rgba(15, 23, 42, 0.09);
        --surface: rgba(255, 255, 255, 0.78);
        --teal: #0d9488;
        --teal-deep: #0f766e;
        --blue: #2563eb;
        --cyan: #06b6d4;
        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04),
          0 8px 24px rgba(15, 23, 42, 0.05);
        --shadow-lg: 0 18px 50px rgba(13, 148, 136, 0.16),
          0 4px 12px rgba(15, 23, 42, 0.06);
        --radius: 22px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* ---------- 背景光晕 ---------- */
      .aurora {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .aurora span {
        position: absolute;
        display: block;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.5;
      }

      .aurora span:nth-child(1) {
        width: 520px;
        height: 520px;
        top: -180px;
        left: -120px;
        background: radial-gradient(circle, #5eead4 0%, rgba(94, 234, 212, 0) 70%);
        animation: drift 22s ease-in-out infinite;
      }

      .aurora span:nth-child(2) {
        width: 560px;
        height: 560px;
        top: -120px;
        right: -160px;
        background: radial-gradient(circle, #93c5fd 0%, rgba(147, 197, 253, 0) 70%);
        animation: drift 26s ease-in-out infinite reverse;
      }

      .aurora span:nth-child(3) {
        width: 480px;
        height: 480px;
        bottom: -220px;
        left: 40%;
        background: radial-gradient(circle, #67e8f9 0%, rgba(103, 232, 249, 0) 70%);
        animation: drift 30s ease-in-out infinite;
      }

      @keyframes drift {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(30px, 26px, 0) scale(1.08);
        }
      }

      /* ---------- 布局 ---------- */
      main {
        position: relative;
        z-index: 1;
        width: min(1080px, 100%);
        margin: 0 auto;
        padding: 72px 24px 56px;
      }

      /* ---------- 头部 ---------- */
      .hero {
        text-align: center;
        margin-bottom: 52px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 16px 7px 12px;
        border: 1px solid rgba(13, 148, 136, 0.22);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(8px);
        color: var(--teal-deep);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        box-shadow: 0 2px 10px rgba(13, 148, 136, 0.08);
      }

      .badge svg {
        width: 16px;
        height: 16px;
      }

      h1 {
        margin: 22px 0 0;
        font-size: clamp(32px, 5.4vw, 50px);
        line-height: 1.14;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      h1 .accent {
        background: linear-gradient(100deg, var(--teal) 0%, var(--cyan) 45%, var(--blue) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .lede {
        margin: 16px auto 0;
        max-width: 560px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.75;
      }

      /* ---------- 卡片 ---------- */
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 250px;
        padding: 28px 26px 24px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: var(--shadow-sm);
        color: inherit;
        text-decoration: none;
        overflow: hidden;
        transition: transform 0.28s cubic-bezier(0.22, 0.61, 0.36, 1),
          box-shadow 0.28s ease, border-color 0.28s ease;
      }

      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(150deg, rgba(13, 148, 136, 0.1), rgba(37, 99, 235, 0.06));
        opacity: 0;
        transition: opacity 0.28s ease;
        pointer-events: none;
      }

      .card:hover,
      .card:focus-visible {
        transform: translateY(-6px);
        border-color: rgba(13, 148, 136, 0.32);
        box-shadow: var(--shadow-lg);
        outline: none;
      }

      .card:hover::after,
      .card:focus-visible::after {
        opacity: 1;
      }

      .tile {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border-radius: 16px;
        color: #fff;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
        flex: none;
      }

      .tile svg {
        width: 26px;
        height: 26px;
      }

      .tile.t1 {
        background: linear-gradient(140deg, #2dd4bf, #0d9488);
      }

      .tile.t2 {
        background: linear-gradient(140deg, #60a5fa, #2563eb);
      }

      .tile.t3 {
        background: linear-gradient(140deg, #22d3ee, #0891b2);
      }

      .card-text {
        flex: 1;
        min-width: 0;
      }

      .card h2 {
        margin: 6px 0 0;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 14.5px;
        line-height: 1.7;
      }

      .go {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        font-size: 14px;
        font-weight: 700;
        color: var(--teal-deep);
        flex: none;
      }

      .go svg {
        width: 16px;
        height: 16px;
        transition: transform 0.28s cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      .card:hover .go svg,
      .card:focus-visible .go svg {
        transform: translateX(5px);
      }

      /* ---------- 页脚 ---------- */
      footer {
        margin-top: 56px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.9;
      }

      footer a {
        color: var(--muted);
        text-decoration: none;
        border-bottom: 1px solid transparent;
      }

      footer a:hover {
        color: var(--teal-deep);
        border-bottom-color: rgba(13, 148, 136, 0.4);
      }

      /* ---------- 平板 ---------- */
      @media (max-width: 900px) {
        main {
          padding: 52px 20px 44px;
        }

        .hero {
          margin-bottom: 34px;
        }

        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px;
        }

        .card {
          min-height: 208px;
          padding: 22px 20px 20px;
        }
      }

      /* ---------- 手机端：整体收紧，争取一屏显示完 ---------- */
      @media (max-width: 640px) {
        main {
          padding: 18px 14px 12px;
        }

        .aurora span {
          filter: blur(56px);
          opacity: 0.4;
        }

        .hero {
          margin-bottom: 14px;
        }

        .badge {
          gap: 5px;
          padding: 4px 11px 4px 8px;
          font-size: 11px;
        }

        .badge svg {
          width: 13px;
          height: 13px;
        }

        h1 {
          margin-top: 10px;
          font-size: 25px;
          line-height: 1.2;
        }

        .lede {
          margin-top: 7px;
          max-width: 21em;
          font-size: 12.5px;
          line-height: 1.5;
        }

        /* 卡片改为横向紧凑排布：图标 | 文案 | 箭头 */
        .grid {
          grid-template-columns: 1fr;
          gap: 9px;
        }

        .card {
          flex-direction: row;
          align-items: center;
          gap: 12px;
          min-height: 0;
          padding: 11px 14px;
          border-radius: 16px;
        }

        .card:hover,
        .card:focus-visible {
          transform: translateY(-2px);
        }

        .tile {
          width: 38px;
          height: 38px;
          border-radius: 12px;
        }

        .tile svg {
          width: 19px;
          height: 19px;
        }

        .card h2 {
          margin: 0;
          font-size: 15px;
          line-height: 1.3;
        }

        .card p {
          margin-top: 2px;
          font-size: 11.5px;
          line-height: 1.45;
        }

        /* 手机上只保留箭头，节省空间 */
        .go {
          margin: 0;
        }

        .go-label {
          display: none;
        }

        .go svg {
          width: 18px;
          height: 18px;
          opacity: 0.7;
        }

        footer {
          margin-top: 13px;
          padding-top: 10px;
          font-size: 11px;
          line-height: 1.6;
        }
      }

      /* 超窄屏再收紧一档 */
      @media (max-width: 380px) {
        h1 {
          font-size: 22px;
        }

        .lede {
          font-size: 11.5px;
        }

        .card {
          gap: 10px;
          padding: 9px 12px;
        }

        .tile {
          width: 34px;
          height: 34px;
        }

        .card h2 {
          font-size: 14px;
        }

        .card p {
          font-size: 11px;
        }
      }

      /* 手机横屏等矮屏场景 */
      @media (max-height: 480px) and (max-width: 900px) {
        main {
          padding: 12px 14px 10px;
        }

        .hero {
          margin-bottom: 10px;
        }

        .badge {
          display: none;
        }

        h1 {
          margin-top: 0;
          font-size: 21px;
        }

        .lede {
          margin-top: 4px;
          font-size: 11.5px;
        }

        .card {
          padding: 9px 12px;
        }

        footer {
          margin-top: 10px;
          padding-top: 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

    <main>
      <header class="hero">
        <span class="badge">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 2.5c-4 6.2-7 10-7 13.4a7 7 0 0 0 14 0c0-3.4-3-7.2-7-13.4Zm0 17.6a5.6 5.6 0 0 1-5.6-5.6c0-1.9 1.5-4.2 3.6-6.9.7-.9 1.3-1.7 1.8-2.5l.2-.3.2.3c.5.8 1.1 1.6 1.8 2.5 2.1 2.7 3.6 5 3.6 6.9A5.6 5.6 0 0 1 12 20.1Z"
            />
          </svg>
          怡口净水 · 内部资料入口
        </span>
        <h1>怡口<span class="accent">净水</span>产品知识库</h1>
        <p class="lede">
          产品说明书、水批认证与条码匹配，一个页面直达全部查询工具。
        </p>
      </header>

      <section class="grid">
        <a class="card" href="knowledge-base/">
          <span class="tile t1" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H11v18H5.5A1.5 1.5 0 0 1 4 19.5v-15Z" />
              <path d="M11 3h7.5A1.5 1.5 0 0 1 20 4.5v15a1.5 1.5 0 0 1-1.5 1.5H11" />
              <path d="M14.5 8h3M14.5 12h3" />
            </svg>
          </span>
          <div class="card-text">
            <h2>产品说明书</h2>
            <p>查询产品型号、分类、正文内容和装箱清单。</p>
          </div>
          <span class="go">
            <span class="go-label">进入说明书</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h13M13 6l6 6-6 6" />
            </svg>
          </span>
        </a>

        <a class="card" href="water-approvals/">
          <span class="tile t2" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="9" r="5.5" />
              <path d="M8.6 9.4l1.9 1.9 3.4-3.8" />
              <path d="M9 14.2 8 21l4-2 4 2-1-6.8" />
            </svg>
          </span>
          <div class="card-text">
            <h2>产品认证资料</h2>
            <p>查询水批、认证证书、水效和检测报告 PDF。</p>
          </div>
          <span class="go">
            <span class="go-label">进入产品认证资料</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h13M13 6l6 6-6 6" />
            </svg>
          </span>
        </a>

        <a class="card" href="https://mlmll.i234.me:5012/product-library">
          <span class="tile t3" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <path d="M4 5h1.5M7 5h1M10 5h1.5M13.5 5H15M16.5 5h1M19.5 5H20" />
              <path d="M4 19h1.5M7 19h1M10 19h1.5M13.5 19H15M16.5 19h1M19.5 19H20" />
              <path d="M6 5v14M9.5 5v14M13 5v14M17.5 5v14M20 5v14" />
            </svg>
          </span>
          <div class="card-text">
            <h2>怡口产品条码匹配</h2>
            <p>跳转到产品条码匹配页面，用于查询和匹配产品信息。</p>
          </div>
          <span class="go">
            <span class="go-label">进入条码匹配</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h13M13 6l6 6-6 6" />
            </svg>
          </span>
        </a>
      </section>

      <footer>
        <div>怡口净水产品知识库 · 静态查询入口</div>
        <div><a href="https://ykjs.mlmll.cn">ykjs.mlmll.cn</a></div>
      </footer>
    </main>
  </body>
</html>
