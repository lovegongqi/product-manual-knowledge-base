<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>怡口净水产品认证资料库</title>
    <link rel="stylesheet" href="assets/styles.css?v=certification-library-20260914" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-row">
          <div>
            <h1>怡口净水产品认证资料库</h1>
            <div class="build-summary" id="buildSummary">正在加载</div>
          </div>
          <div class="brand-actions">
            <nav class="top-links" aria-label="页面导航">
              <a href="../">主页</a>
              <a href="../knowledge-base/">产品说明书</a>
            </nav>
            <div class="result-total" id="resultTotal">0 份</div>
          </div>
        </div>

        <div class="controls" aria-label="筛选">
          <div class="search-field">
            <label for="searchInput">搜索</label>
            <div class="search-row">
              <input id="searchInput" type="search" autocomplete="off" placeholder="型号、标题、关键词" />
              <button id="clearSearch" class="clear-button" type="button">清空</button>
            </div>
          </div>
          <div class="category-filters" id="categoryFilters" aria-label="资料类型"></div>
        </div>
      </header>

      <main class="workspace">
        <section class="results-pane" aria-label="产品认证资料列表">
          <div class="pane-head">
            <strong>认证资料</strong>
          </div>
          <div class="manual-list" id="reportList"></div>
        </section>
        <section class="detail-pane" aria-label="产品认证资料详情">
          <div id="reportDetail" class="detail-empty">选择一份认证资料</div>
        </section>
      </main>
    </div>

    <script src="assets/reports-data.js?v=20260914"></script>
    <script src="assets/app.js?v=certification-library-20260914"></script>
  </body>
</html>
